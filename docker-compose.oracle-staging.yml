services:
  fortress-backend:
    image: ${FORTRESS_IMAGE:?Set FORTRESS_IMAGE to an immutable image tag}
    container_name: fortress-backend
    restart: unless-stopped
    env_file:
      - .env.oracle.staging
    environment:
      PORT: "8000"
    expose:
      - "8000"
    networks:
      - fortress-shared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: fortress-caddy
    restart: unless-stopped
    depends_on:
      fortress-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:?Set staging API domain}
      PRODUCTION_API_DOMAIN: ${PRODUCTION_API_DOMAIN:?Set production API domain}
    networks:
      - fortress-shared
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  fortress-shared:
    external: true

volumes:
  caddy_data:
  caddy_config:
