name: NSE Bhav Copy Daily Refresh

# Triggers a background NSE Bhav Copy fetch on the deployed FastAPI backend
# (POST /api/bhavcopy/refresh — see engine/routers/bhavcopy.py). This repo
# has no OS-level cron (Render's Root Directory=engine web service has no
# separate cron job configured); the established precedent for scheduled
# work against the deployed backend is a GitHub Actions `schedule:` cron
# doing an HTTP call, same shape as keepalive.yml's Streamlit pinger.
#
# The refresh job itself (bhavcopy.jobs.run_bhavcopy_refresh_job) already
# checks bhavcopy_fetch_log before touching the network, so re-running this
# workflow (a retry, or workflow_dispatch) is always safe — it's a no-op if
# today's file is already fetched.
#
# Wakes the backend (bounded retries) before triggering, same reasoning and
# thresholds as auto-scan-eod.yml — this job runs earlier in the day and
# the service may equally be asleep/cold. Trigger failures are retried only
# when transient (5xx/connect failure); 401/403 fail immediately.
#
# Required repo secrets:
#   FORTRESS_BACKEND_URL  — e.g. https://your-backend.onrender.com (no trailing slash)
#   FORTRESS_API_KEY      — same value as the FORTRESS_API_KEY env var on Render
#                            (the backend requires X-API-Key on non-auth routes
#                            whenever that env var is configured)

on:
  schedule:
    # 13:30 UTC = 19:00 IST, weekdays — after NSE's usual Bhav Copy publish
    # window (typically 18:30-19:30 IST). A second run at 20:30 IST catches
    # a file that wasn't published yet at the first attempt (the job logs
    # "not_yet_published" and simply retries, per the dedup-log design).
    - cron: '30 13 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # allow manual triggering, e.g. for a backfill kickoff

concurrency:
  group: fortress-bhavcopy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend, then POST /api/bhavcopy/refresh
        run: |
          set -u

          if [ -z "${{ secrets.FORTRESS_BACKEND_URL }}" ]; then
            echo "FORTRESS_BACKEND_URL secret is not set — skipping (nothing to call)."
            exit 0
          fi

          BASE_URL="${{ secrets.FORTRESS_BACKEND_URL }}"
          API_KEY="${{ secrets.FORTRESS_API_KEY }}"
          CONNECT_TIMEOUT=10
          REQUEST_TIMEOUT=30

          WAKE_ATTEMPTS=12
          WAKE_WAIT_SECONDS=15
          awake=0
          for i in $(seq 1 "$WAKE_ATTEMPTS"); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$REQUEST_TIMEOUT" \
              "$BASE_URL/api/health" || echo "000")
            echo "Wake attempt $i/$WAKE_ATTEMPTS: HTTP $status"
            if [ "$status" = "200" ]; then
              awake=1
              break
            fi
            sleep "$WAKE_WAIT_SECONDS"
          done
          if [ "$awake" -ne 1 ]; then
            echo "FAILURE: backend did not wake after $WAKE_ATTEMPTS attempts (last status: $status)"
            exit 1
          fi
          echo "Backend is awake."

          TRIGGER_ATTEMPTS=5
          TRIGGER_WAIT_SECONDS=15
          for i in $(seq 1 "$TRIGGER_ATTEMPTS"); do
            http_status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$REQUEST_TIMEOUT" \
              -X POST "$BASE_URL/api/bhavcopy/refresh" \
              -H "Content-Type: application/json" \
              -H "X-API-Key: $API_KEY" \
              -d '{"force": false}')
            echo "Trigger attempt $i/$TRIGGER_ATTEMPTS: HTTP $http_status"

            if [ "$http_status" = "401" ] || [ "$http_status" = "403" ]; then
              echo "FAILURE: POST /api/bhavcopy/refresh returned $http_status (auth/config error — not retrying)"
              exit 1
            fi
            if [ "$http_status" -ge 400 ] && [ "$http_status" -lt 500 ] && [ "$http_status" != "429" ]; then
              echo "FAILURE: POST /api/bhavcopy/refresh returned $http_status (client error — not retrying)"
              cat /tmp/response.json
              exit 1
            fi
            if [ "$http_status" -lt 300 ]; then
              echo "Response body:"
              cat /tmp/response.json
              echo ""
              exit 0
            fi
            if [ "$i" -lt "$TRIGGER_ATTEMPTS" ]; then
              sleep "$TRIGGER_WAIT_SECONDS"
            fi
          done

          echo "FAILURE: POST /api/bhavcopy/refresh did not succeed after $TRIGGER_ATTEMPTS attempts (last status: $http_status)"
          exit 1
