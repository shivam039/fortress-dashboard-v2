name: Deploy Oracle Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oracle-staging-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/fortress-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Prepare SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_PRIVATE_KEY"
          test -n "$ORACLE_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle_staging
          chmod 600 ~/.ssh/oracle_staging
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          ssh -i ~/.ssh/oracle_staging "$ORACLE_USER@$ORACLE_HOST" "sudo mkdir -p /opt/fortress-dashboard && sudo chown $ORACLE_USER:$ORACLE_USER /opt/fortress-dashboard"
          scp -i ~/.ssh/oracle_staging docker-compose.oracle-staging.yml Caddyfile "$ORACLE_USER@$ORACLE_HOST:/opt/fortress-dashboard/"
          scp -i ~/.ssh/oracle_staging scripts/deploy-oracle-staging.sh "$ORACLE_USER@$ORACLE_HOST:/opt/fortress-dashboard/deploy-oracle-staging.sh"
          ssh -i ~/.ssh/oracle_staging "$ORACLE_USER@$ORACLE_HOST" "chmod +x /opt/fortress-dashboard/deploy-oracle-staging.sh"

      - name: Deploy and verify health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_STAGING_BACKEND_URL: ${{ secrets.ORACLE_STAGING_BACKEND_URL }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          FORTRESS_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_STAGING_BACKEND_URL"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/oracle_staging "$ORACLE_USER@$ORACLE_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/oracle_staging "$ORACLE_USER@$ORACLE_HOST" \
            "FORTRESS_IMAGE='$FORTRESS_IMAGE' ORACLE_STAGING_BACKEND_URL='$ORACLE_STAGING_BACKEND_URL/api/health' /opt/fortress-dashboard/deploy-oracle-staging.sh"
