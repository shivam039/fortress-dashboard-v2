[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
extend-exclude = ["engine/legacy"]

# No [tool.vercel] section here on purpose — the FastAPI backend deploys to
# Render (see DEPLOYMENT.md §2), not Vercel. Vercel's project Root Directory
# is set to `frontend/`, so it only ever sees and builds the Next.js app.
